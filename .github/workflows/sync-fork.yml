name: Sync Fork

on:
  schedule:
    # 每天 UTC 0 点（北京时间早上 8 点）运行
    - cron: '0 0 * * *'
  workflow_dispatch:  # 允许你手动触发

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork repo
        uses: actions/checkout@v4

      - name: Add upstream repository
        run: |
          git remote add upstream https://github.com/ZhuLinsen/daily_stock_analysis.git

      - name: Fetch upstream changes
        run: |
          git fetch upstream

      - name: Switch to default branch
        run: |
          git checkout main   # 如果你的分支是 master，改成 master

      - name: Merge upstream changes
        run: |
          git merge upstream/main   # 同样，注意分支名

      - name: Push to fork
        run: |
          git push origin main
