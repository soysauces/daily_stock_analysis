name: Sync Fork

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup upstream
        run: |
          git remote remove upstream || true
          git remote add upstream https://github.com/ZhuLinsen/daily_stock_analysis.git
          git fetch upstream
      
      - name: Merge (first time with unrelated histories)
        run: |
          git checkout main
          git merge upstream/main --allow-unrelated-histories --no-edit || true
          git push origin main
